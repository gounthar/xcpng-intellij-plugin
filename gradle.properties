group=dev.gounthar.xcpng.intellij
version=0.0.1

org.gradle.caching=true

# NOT enabled, deliberately, and this differs from the toolbox sibling. The IntelliJ Platform
# Gradle plugin 2.x is not configuration-cache clean in every task (verifyPlugin and runIde in
# particular resolve state at execution time). Turning it on produces a failure naming Gradle
# internals rather than the offending task, which costs more to read than the cache saves.
# org.gradle.configuration-cache=true

# LOAD BEARING. The IntelliJ Platform provides kotlin-stdlib at runtime, so the Kotlin Gradle
# plugin must not add it as an implementation dependency. Leaving this at the default bundles
# a second stdlib into the plugin zip, the platform loads two, and it surfaces at runtime as a
# NoSuchMethodError or a LinkageError inside the IDE rather than as a build failure.
#
# Same class of trap the toolbox sibling records for the Toolbox API, where the fix is
# compileOnly. Different mechanism, identical reasoning: the host supplies it, so compile
# against it and ship nothing.
kotlin.stdlib.default.dependency=false

# REMOVED: kotlin.incremental.useClasspathSnapshot. The Kotlin Gradle plugin warned that it is
# unsupported and that the approach it selected has been removed in favour of ABI snapshots.
# It was added by pattern-matching rather than for a reason, which is the kind of line that
# survives for years because nothing fails when it is wrong.
